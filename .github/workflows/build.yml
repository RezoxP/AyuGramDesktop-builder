name: Build AyuGram Desktop

# Builds AyuGram Desktop for Windows (x64 & x86), Linux (x64 & optional x86), and macOS.
# Creates a GitHub Release with all platform artifacts and updates the auto-update manifest.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'AyuGram branch to build'
        required: false
        default: 'dev'
      commit:
        description: 'Exact upstream commit SHA to build (optional, overrides branch tip)'
        required: false
        default: ''
      enable_lto:
        description: 'Enable Link-Time Optimization (slower and memory heavy — keep false for fastest, reliable CI builds)'
        required: false
        type: boolean
        default: false
      create_release:
        description: 'Create GitHub Release and update manifest'
        required: false
        type: boolean
        default: true
      build_windows_x64:
        description: 'Build Windows x64'
        required: false
        type: boolean
        default: true
      build_windows_x86:
        description: 'Build Windows x86'
        required: false
        type: boolean
        default: true
      build_linux_x64:
        description: 'Build Linux x64'
        required: false
        type: boolean
        default: true
      build_macos:
        description: 'Build macOS (Universal / Apple Silicon & Intel)'
        required: false
        type: boolean
        default: true
      build_linux_x86:
        description: 'Build Linux x86 32-bit (experimental)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ayugram-build
  cancel-in-progress: false

env:
  AYUGRAM_REPO: AyuGram/AyuGramDesktop
  TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID || '2040' }}
  TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH || 'b18441a1ff607e10a989891a5462e627' }}
  DESKTOP_APP_ENABLE_LTO: ${{ (github.event.inputs.enable_lto == 'true' || inputs.enable_lto == true) && 'ON' || 'OFF' }}

jobs:

  # ---------------------------------------------------------------------
  # Windows x64 via MSVC on windows-2022
  # ---------------------------------------------------------------------
  windows_x64:
    name: Windows x64
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_windows_x64 != false }}
    runs-on: windows-2022
    timeout-minutes: 360

    outputs:
      version: ${{ steps.version.outputs.version }}
      version_num: ${{ steps.version.outputs.version_num }}
      upstream_sha: ${{ steps.clone.outputs.upstream_sha }}

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Clean disk
        run: |
          if exist "C:\Program Files\Android" rmdir /s /q "C:\Program Files\Android"
          if exist "C:\hostedtoolcache\windows" rmdir /s /q "C:\hostedtoolcache\windows"
          if exist "C:\Program Files\dotnet" rmdir /s /q "C:\Program Files\dotnet"
          if exist "C:\mysql" rmdir /s /q "C:\mysql"
          net stop SQLWriter 2>nul || ver >nul
          taskkill /F /IM sqlwriter.exe /T 2>nul || ver >nul
          taskkill /F /IM sqlservr.exe /T 2>nul || ver >nul
          if exist "C:\Program Files\Microsoft SQL Server" rmdir /s /q "C:\Program Files\Microsoft SQL Server"
          exit /b 0

      - name: Expand virtual memory
        uses: al-cheb/configure-pagefile-action@v1.5
        with:
          minimum-size: 16GB
          maximum-size: 32GB
          disk-root: "C:"

      - name: Setup environment
        shell: bash
        run: |
          set -e
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          BRANCH="${{ inputs.branch || 'dev' }}"
          COMMIT="${{ inputs.commit }}"

          mkdir -p "$USERPROFILE/TBuild/Libraries"
          echo "REPO_NAME=$REPO_NAME" >> $GITHUB_ENV
          echo "TBUILD=$GITHUB_WORKSPACE/TBuild" >> $GITHUB_ENV
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "COMMIT=$COMMIT" >> $GITHUB_ENV
          echo "LIBS_BASE=$GITHUB_WORKSPACE/TBuild/Libraries/win64" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' \
            "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake 2>/dev/null || true

          git config --global user.email "AyuGramBuilder@users.noreply.github.com"
          git config --global user.name "AyuGram CI"

      - name: Create TBuild symlink
        run: mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone AyuGramDesktop
        id: clone
        shell: bash
        run: |
          set -e
          git clone --filter=blob:none --depth 1 --branch "$BRANCH" \
            "https://github.com/${{ env.AYUGRAM_REPO }}.git" "$TBUILD/$REPO_NAME"

          if [ -n "$COMMIT" ]; then
            if git -C "$TBUILD/$REPO_NAME" fetch --depth 1 origin "$COMMIT"; then
              git -C "$TBUILD/$REPO_NAME" checkout --detach FETCH_HEAD
              echo "::notice::Checked out upstream commit $COMMIT"
            fi
          fi

          git -C "$TBUILD/$REPO_NAME" submodule update --init --recursive --depth=1
          UPSTREAM_SHA=$(git -C "$TBUILD/$REPO_NAME" rev-parse HEAD)
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV
          echo "upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
          echo "Upstream commit: $UPSTREAM_SHA"

      - name: Apply patches
        shell: bash
        run: |
          python .github/scripts/apply_patches.py "$TBUILD/$REPO_NAME" \
            --platform windows \
            --manifest-url "https://raw.githubusercontent.com/${{ github.repository }}/update-manifest/"

      - name: Read version & cache key
        id: version
        shell: bash
        run: |
          set -e
          VFILE="$TBUILD/$REPO_NAME/Telegram/build/version"
          VERSION=$(grep 'AppVersionStr ' "$VFILE" | awk '{ print $2 }')
          VERSION_NUM=$(grep 'AppVersion ' "$VFILE" | awk '{ print $2 }')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_NUM=$VERSION_NUM" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_num=$VERSION_NUM" >> $GITHUB_OUTPUT

          DOCPATH="$TBUILD/$REPO_NAME/docs/building-win.md"
          SDK=$(grep "SDK version" "$DOCPATH" 2>/dev/null | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/' | head -1)
          if [ -z "$SDK" ]; then SDK="10.0.26100.0"; fi
          echo "SDK=$SDK" >> $GITHUB_ENV
          echo "Using Windows SDK: $SDK"

          {
            echo "v4-libs-x64"
            cat "$TBUILD/$REPO_NAME/Telegram/build/prepare/prepare.py"
            cat "$TBUILD/$REPO_NAME/Telegram/build/qt_version.py" 2>/dev/null || true
            find "$TBUILD/$REPO_NAME/Telegram/build/prepare/patches" -type f -print0 2>/dev/null | sort -z | xargs -0 cat 2>/dev/null || true
            echo "$SDK"
          } | sha256sum | awk '{ print $1 }' > CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
          sdk: ${{ env.SDK }}

      - name: NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache (restore)
        uses: actions/cache/restore@v4
        id: cache-third-party
        with:
          path: ${{ env.TBUILD }}/ThirdParty
          key: Windows-x64-third-party-v4-${{ env.CACHE_KEY }}
          restore-keys: Windows-x64-third-party-v4-

      - name: Libraries cache (restore)
        uses: actions/cache/restore@v4
        id: cache-libs
        with:
          path: |
            ${{ env.LIBS_BASE }}/*
            !${{ env.LIBS_BASE }}/cache_keys
            !${{ env.LIBS_BASE }}/[qQ]t[_-]*
            ${{ env.LIBS_BASE }}/cache_keys/*
            !${{ env.LIBS_BASE }}/cache_keys/[qQ]t[_-]*
          key: Windows-x64-libs-v4-${{ env.CACHE_KEY }}
          restore-keys: Windows-x64-libs-v4-

      - name: Qt cache (restore)
        uses: actions/cache/restore@v4
        id: cache-qt
        with:
          path: |
            ${{ env.LIBS_BASE }}/[qQ]t[_-]*
            ${{ env.LIBS_BASE }}/cache_keys/[qQ]t[_-]*
          key: Windows-x64-qt-v4-${{ env.CACHE_KEY }}
          restore-keys: Windows-x64-qt-v4-

      - name: Build libraries
        env:
          GYP_MSVS_OVERRIDE_PATH: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\'
          GYP_MSVS_VERSION: 2022
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent

      - name: Generate stub DesktopPrivate
        shell: bash
        run: |
          mkdir -p "$TBUILD/DesktopPrivate"
          random_key() {
            printf -- '[REDACTED:ssh_private_key]\n%s\n-----END RSA PRIVATE KEY-----\n' \
              "$(head -c 96 /dev/urandom | base64 | tr -d '\n')"
          }
          printf 'const char *PrivateKey = "%s";\nconst char *PrivateBetaKey = "%s";\n' \
            "$(random_key)" "$(random_key)" > "$TBUILD/DesktopPrivate/packer_private.h"
          printf 'static const char *AlphaPrivateKey = "%s";\n' \
            "$(random_key)" > "$TBUILD/DesktopPrivate/alpha_private.h"

      - name: Free disk space
        shell: bash
        run: |
          if [ -d "$LIBS_BASE" ]; then
            find "$LIBS_BASE" \
              '(' \
                '(' \
                  ! '(' \
                    -name '*.lib' -o -name '*.a' -o -name '*.exe' \
                    -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' \
                    -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' \
                    -o -path '*/objects-*' -o -path '*/cache_keys/*' \
                    -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' \
                  ')' \
                  -type f \
                ')' \
                -o -empty \
              ')' -delete
          fi

      - name: Save ThirdParty cache
        if: steps.cache-third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TBUILD }}/ThirdParty
          key: ${{ steps.cache-third-party.outputs.cache-primary-key }}

      - name: Save Libraries cache
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LIBS_BASE }}/*
            !${{ env.LIBS_BASE }}/cache_keys
            !${{ env.LIBS_BASE }}/[qQ]t[_-]*
            ${{ env.LIBS_BASE }}/cache_keys/*
            !${{ env.LIBS_BASE }}/cache_keys/[qQ]t[_-]*
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

      - name: Save Qt cache
        if: steps.cache-qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LIBS_BASE }}/[qQ]t[_-]*
            ${{ env.LIBS_BASE }}/cache_keys/[qQ]t[_-]*
          key: ${{ steps.cache-qt.outputs.cache-primary-key }}

      - name: Build AyuGram
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram
          call configure.bat ^
            x64 ^
            -D TDESKTOP_API_ID=%TDESKTOP_API_ID% ^
            -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH% ^
            -D CMAKE_CONFIGURATION_TYPES=Release ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON ^
            -D DESKTOP_APP_ENABLE_LTO=%DESKTOP_APP_ENABLE_LTO%
          cmake --build ..\out --config Release --parallel %NUMBER_OF_PROCESSORS%

      - name: Package
        shell: bash
        run: |
          set -e
          OUT="$TBUILD/$REPO_NAME/out/Release"
          [ -d "$OUT" ] || { echo "::error::$OUT not found"; exit 1; }
          mkdir -p pkg
          for f in AyuGram.exe Telegram.exe; do
            [ -f "$OUT/$f" ] && cp "$OUT/$f" pkg/AyuGram.exe && break
          done
          [ -f "$OUT/Updater.exe" ] && cp "$OUT/Updater.exe" pkg/ || true
          [ -d "$OUT/modules" ] && cp -r "$OUT/modules" pkg/ || true
          find pkg \( -name '*.pdb' -o -name '*.ilk' -o -name '*.exp' \) -print0 2>/dev/null | xargs -0 -r rm -f || true
          cd pkg && 7z a -mx9 "../AyuGram-Windows-x64-${VERSION}.zip" . > /dev/null

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-x64-${{ env.VERSION }}
          path: "AyuGram-Windows-x64-${{ env.VERSION }}.zip"
          retention-days: 90

  # ---------------------------------------------------------------------
  # Windows x86 via MSVC on windows-2022
  # ---------------------------------------------------------------------
  windows_x86:
    name: Windows x86
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_windows_x86 != false }}
    runs-on: windows-2022
    timeout-minutes: 360

    outputs:
