name: Build AyuGram Desktop

on:
  schedule:
    # Run daily at 03:00 UTC to check for upstream updates
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'AyuGram branch to build'
        required: true
        default: 'dev'
      enable_lto:
        description: 'Enable Link-Time Optimization (LTO)'
        required: true
        type: boolean
        default: true
      force_build:
        description: 'Force build even if release already exists for upstream version'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

env:
  TDESKTOP_API_ID: "2040"
  TDESKTOP_API_HASH: "b18441a1ff607e10a989891a5462e627"

jobs:

  check:
    name: Check Upstream Version
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      version: ${{ steps.version.outputs.version }}
      version_num: ${{ steps.version.outputs.version_num }}
      branch: ${{ steps.config.outputs.branch }}
      enable_lto: ${{ steps.config.outputs.enable_lto }}
    steps:
      - name: Resolve Configuration
        id: config
        run: |
          BRANCH="${{ github.event.inputs.branch || 'dev' }}"
          FORCE="${{ github.event.inputs.force_build || 'false' }}"
          LTO="${{ github.event.inputs.enable_lto != 'false' }}"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "force_build=$FORCE" >> $GITHUB_OUTPUT
          echo "enable_lto=$LTO" >> $GITHUB_OUTPUT

      - name: Fetch Upstream Version
        id: version
        run: |
          BRANCH="${{ steps.config.outputs.branch }}"
          URL="https://raw.githubusercontent.com/AyuGram/AyuGramDesktop/${BRANCH}/Telegram/build/version"
          echo "Fetching version from $URL..."
          VCONTENT=$(curl -fsSL "$URL") || { echo "Failed to fetch upstream version"; exit 1; }
          VERSION=$(echo "$VCONTENT" | grep 'AppVersionStr ' | awk '{ print $2 }')
          VERSION_NUM=$(echo "$VCONTENT" | grep 'AppVersion ' | awk '{ print $2 }')
          echo "Upstream AppVersionStr: $VERSION"
          echo "Upstream AppVersion: $VERSION_NUM"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_num=$VERSION_NUM" >> $GITHUB_OUTPUT

      - name: Determine if build is needed
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          FORCE="${{ steps.config.outputs.force_build }}"
          TAG="v${VERSION}"

          echo "Checking if release $TAG exists in ${{ github.repository }}..."
          STATUS=$(gh release view "$TAG" --repo "${{ github.repository }}" --json tagName -q .tagName 2>/dev/null || echo "")

          if [ -n "$STATUS" ] && [ "$FORCE" != "true" ]; then
            echo "Release $TAG already exists in ${{ github.repository }} and force_build is not set."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            if [ -n "$STATUS" ]; then
              echo "Release $TAG exists, but force_build is true. Triggering build."
            else
              echo "Release $TAG does not exist. Triggering build."
            fi
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  windows:
    name: Windows ${{ matrix.arch }}
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: windows-2022
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]

    defaults:
      run:
        shell: cmd

    env:
      BRANCH: ${{ needs.check.outputs.branch }}
      DESKTOP_APP_ENABLE_LTO: ${{ needs.check.outputs.enable_lto == 'true' && 'ON' || 'OFF' }}

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Clean disk
        run: |
          if exist "C:\Program Files\Android" rmdir /s /q "C:\Program Files\Android"
          if exist "C:\hostedtoolcache\windows" rmdir /s /q "C:\hostedtoolcache\windows"
          if exist "C:\Program Files\dotnet" rmdir /s /q "C:\Program Files\dotnet"
          if exist "C:\mysql" rmdir /s /q "C:\mysql"
          net stop SQLWriter 2>nul || ver >nul
          taskkill /F /IM sqlwriter.exe /T 2>nul || ver >nul
          taskkill /F /IM sqlservr.exe /T 2>nul || ver >nul
          if exist "C:\Program Files\Microsoft SQL Server" rmdir /s /q "C:\Program Files\Microsoft SQL Server"
          exit /b 0

      - name: Expand virtual memory
        uses: al-cheb/configure-pagefile-action@v1.5
        with:
          minimum-size: 16GB
          maximum-size: 32GB
          disk-root: "C:"

      - name: Setup environment
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          echo "REPO_NAME=$REPO_NAME" >> $GITHUB_ENV

          mkdir -p "$USERPROFILE/TBuild/Libraries"
          echo "TBUILD=$GITHUB_WORKSPACE/TBuild" >> $GITHUB_ENV
          echo "LibrariesPath=$GITHUB_WORKSPACE/TBuild/Libraries/${{ matrix.arch }}" >> $GITHUB_ENV

          SDK="10.0.26100.0"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' \
            "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          git config --global user.email "AyuGramBuilder@users.noreply.github.com"
          git config --global user.name "AyuGram CI"

      - name: Create TBuild symlink
        run: mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone AyuGramDesktop
        run: |
          git clone --recursive --depth 1 --shallow-submodules --jobs %NUMBER_OF_PROCESSORS% ^
            --branch "%BRANCH%" --filter=blob:none ^
            https://github.com/AyuGram/AyuGramDesktop.git "%TBUILD%\%REPO_NAME%"
        shell: cmd

      - name: Apply patches
        shell: bash
        run: |
          python .github/scripts/apply_patches.py "$TBUILD/$REPO_NAME" --platform windows

      - name: Read version & cache key
        shell: bash
        run: |
          VFILE="$TBUILD/$REPO_NAME/Telegram/build/version"
          VERSION=$(grep 'AppVersionStr ' "$VFILE" | awk '{ print $2 }')
          VERSION_NUM=$(grep 'AppVersion ' "$VFILE" | awk '{ print $2 }')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_NUM=$VERSION_NUM" >> $GITHUB_ENV

          PREP="$TBUILD/$REPO_NAME/Telegram/build/prepare/prepare.py"
          echo "$(sha256sum "$PREP" | awk '{ print $1 }')" > CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.arch }}
          sdk: ${{ env.SDK }}

      - name: NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}/ThirdParty
          key: ${{ runner.OS }}-${{ matrix.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-third-party-

      - name: Libraries cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}/*
            !${{ env.LibrariesPath }}/cache_keys
            !${{ env.LibrariesPath }}/[qQ]t[_-]*
            ${{ env.LibrariesPath }}/cache_keys/*
            !${{ env.LibrariesPath }}/cache_keys/[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-libs-

      - name: Qt cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}/[qQ]t[_-]*
            ${{ env.LibrariesPath }}/cache_keys/[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-qt-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-qt-

      - name: Build libraries
        env:
          GYP_MSVS_OVERRIDE_PATH: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\'
          GYP_MSVS_VERSION: 2022
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent

      - name: Free disk space
        shell: bash
        run: |
          if [ -d "$LibrariesPath" ]; then
            find $LibrariesPath \
              '(' \
                '(' \
                  ! '(' \
                    -name '*.lib' -o -name '*.a' -o -name '*.exe' \
                    -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' \
                    -o -name '*.cmake' -o -path '*/include/*' \
                    -o -path '*/objects-*' -o -path '*/cache_keys/*' \
                    -o -path '*/patches/*' \
                  ')' \
                  -type f \
                ')' \
                -o -empty \
              ')' -delete
          fi

      - name: Build AyuGram
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram
          call configure.bat ^
            ${{ matrix.arch }} ^
            -D TDESKTOP_API_ID=%TDESKTOP_API_ID% ^
            -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH% ^
            -D CMAKE_CONFIGURATION_TYPES=Release ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON ^
            -D DESKTOP_APP_ENABLE_LTO=%DESKTOP_APP_ENABLE_LTO%
          cmake --build ..\out --config Release --parallel %NUMBER_OF_PROCESSORS%

      - name: Package
        shell: bash
        run: |
          OUT="$TBUILD/$REPO_NAME/out/Release"
          mkdir -p pkg
          for f in AyuGram.exe Telegram.exe; do
            [ -f "$OUT/$f" ] && cp "$OUT/$f" pkg/AyuGram.exe && break
          done
          [ -f "$OUT/Updater.exe" ] && cp "$OUT/Updater.exe" pkg/
          [ -d "$OUT/modules" ] && cp -r "$OUT/modules" pkg/
          find pkg -name '*.pdb' -o -name '*.ilk' -o -name '*.exp' | xargs rm -f 2>/dev/null || true
          cd pkg && 7z a -mx9 "../AyuGram-Windows-${{ matrix.arch }}-${VERSION}.zip" . > /dev/null

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-${{ matrix.arch }}-${{ env.VERSION }}
          path: "AyuGram-Windows-${{ matrix.arch }}-${{ env.VERSION }}.zip"
          retention-days: 90

  linux:
    name: Linux x64
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    outputs:
      version: ${{ steps.version.outputs.version }}
      version_num: ${{ steps.version.outputs.version_num }}

    env:
      BRANCH: ${{ needs.check.outputs.branch }}
      DESKTOP_APP_ENABLE_LTO: ${{ needs.check.outputs.enable_lto == 'true' && 'ON' || 'OFF' }}

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
            /opt/ghc /usr/local/graalvm /usr/local/.ghcup \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone AyuGramDesktop and pull Docker image
        run: |
          docker pull ghcr.io/telegramdesktop/tdesktop/centos_env:latest &
          DOCKER_PID=$!
          git clone --recursive --depth 1 --shallow-submodules \
            --jobs $(nproc) --filter=blob:none \
            --branch "$BRANCH" \
            https://github.com/AyuGram/AyuGramDesktop.git tdesktop
          wait $DOCKER_PID

      - name: Apply patches
        run: |
          python3 .github/scripts/apply_patches.py tdesktop --platform linux

      - name: Read version
        id: version
        run: |
          VFILE="tdesktop/Telegram/build/version"
          VERSION=$(grep 'AppVersionStr ' "$VFILE" | awk '{ print $2 }')
          VERSION_NUM=$(grep 'AppVersion ' "$VFILE" | awk '{ print $2 }')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_NUM=$VERSION_NUM" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_num=$VERSION_NUM" >> $GITHUB_OUTPUT

      - name: Enable parallel Docker build
        run: |
          sed -i 's|cmake --build \.\./out|cmake --build ../out --parallel $(nproc)|' \
            tdesktop/Telegram/build/docker/centos_env/build.sh

      - name: Build AyuGram
        run: |
          cd tdesktop
          docker run --rm \
            -u $(id -u) \
            -v "$PWD:/usr/src/tdesktop" \
            -e CONFIG=Release \
            ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D TDESKTOP_API_ID=${{ env.TDESKTOP_API_ID }} \
            -D TDESKTOP_API_HASH=${{ env.TDESKTOP_API_HASH }} \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON \
            -D DESKTOP_APP_ENABLE_LTO=${{ env.DESKTOP_APP_ENABLE_LTO }}

      - name: Package
        run: |
          mkdir -p pkg
          for bin in AyuGram Telegram; do
            [ -f "tdesktop/out/Release/$bin" ] && cp "tdesktop/out/Release/$bin" pkg/AyuGram && break
          done
          [ -f tdesktop/out/Release/Updater ] && cp tdesktop/out/Release/Updater pkg/
          strip --strip-all pkg/* 2>/dev/null || true
          chmod +x pkg/*

          # Create both .zip (for in-app minizip autoupdate) and .tar.gz (for standard Linux extraction)
          (cd pkg && zip -r -9 "../AyuGram-Linux-x64-${VERSION}.zip" .)
          tar -czf "AyuGram-Linux-x64-${VERSION}.tar.gz" -C pkg .

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Linux-x64-${{ env.VERSION }}
          path: |
            AyuGram-Linux-x64-${{ env.VERSION }}.zip
            AyuGram-Linux-x64-${{ env.VERSION }}.tar.gz
          retention-days: 90

  release:
    name: Create Release
    needs: [check, windows, linux]
    if: needs.check.outputs.should_build == 'true' && success()
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ needs.linux.outputs.version }}
      VERSION_NUM: ${{ needs.linux.outputs.version_num }}
      BRANCH: ${{ needs.check.outputs.branch }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: AyuGram v${{ env.VERSION }}
          body: |
            **AyuGram Desktop v${{ env.VERSION }}**

            | Platform | Arch | Format | File |
            |----------|------|--------|------|
            | Windows  | x64  | zip    | `AyuGram-Windows-x64-${{ env.VERSION }}.zip` |
            | Windows  | x86  | zip    | `AyuGram-Windows-x86-${{ env.VERSION }}.zip` |
            | Linux    | x64  | zip    | `AyuGram-Linux-x64-${{ env.VERSION }}.zip` (in-app update compatible) |
            | Linux    | x64  | tar.gz | `AyuGram-Linux-x64-${{ env.VERSION }}.tar.gz` |

            Upstream Branch: `${{ env.BRANCH }}`
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update manifest
        run: |
          TAG="v${VERSION}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          cat > current4 << EOF
          {
            "win64": { "stable": { "released": "${VERSION_NUM}", "link": "${BASE}/AyuGram-Windows-x64-${VERSION}.zip" } },
            "win":   { "stable": { "released": "${VERSION_NUM}", "link": "${BASE}/AyuGram-Windows-x86-${VERSION}.zip" } },
            "linux": { "stable": { "released": "${VERSION_NUM}", "link": "${BASE}/AyuGram-Linux-x64-${VERSION}.zip" } }
          }
          EOF
          python3 -c "import json; json.load(open('current4'))" || { echo 'Invalid manifest JSON'; exit 1; }
          git init -q
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git config user.email "AyuGramBuilder@users.noreply.github.com"
          git config user.name "AyuGram CI"
          git checkout --orphan update-manifest
          git add current4
          git commit -q -m "Update manifest for v${VERSION}"
          git push -f origin update-manifest
