name: Build AyuGram Desktop

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'AyuGram branch to build'
        required: true
        default: 'dev'

permissions:
  contents: write

env:
  TDESKTOP_API_ID: "2040"
  TDESKTOP_API_HASH: "b18441a1ff607e10a989891a5462e627"
  PREPARE_PATH: "Telegram/build/prepare/prepare.py"

jobs:

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2022
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout builder repo.
        uses: actions/checkout@v4

      - name: Deep clean disk.
        run: |
          if exist "C:\Program Files\Android" rmdir /s /q "C:\Program Files\Android"
          if exist "C:\hostedtoolcache\windows" rmdir /s /q "C:\hostedtoolcache\windows"
          if exist "C:\Program Files\dotnet" rmdir /s /q "C:\Program Files\dotnet"
          if exist "C:\mysql" rmdir /s /q "C:\mysql"
          net stop SQLWriter 2>nul || ver >nul
          taskkill /F /IM sqlwriter.exe /T 2>nul || ver >nul
          taskkill /F /IM sqlservr.exe /T 2>nul || ver >nul
          if exist "C:\Program Files\Microsoft SQL Server" rmdir /s /q "C:\Program Files\Microsoft SQL Server"
          exit /b 0

      - name: Expand virtual memory.
        uses: al-cheb/configure-pagefile-action@v1.4
        with:
          minimum-size: 16GB
          maximum-size: 32GB
          disk-root: "C:"

      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\${{ matrix.arch }}>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone AyuGramDesktop.
        uses: actions/checkout@v4
        with:
          repository: AyuGram/AyuGramDesktop
          ref: ${{ github.event.inputs.branch }}
          submodules: recursive
          path: ${{ env.TBUILD }}/${{ env.REPO_NAME }}

      - name: Read version.
        shell: bash
        run: |
          VERSION=$(grep 'AppVersionStr ' $TBUILD/$REPO_NAME/Telegram/build/version | awk '{ print $2 }')
          VERSION_NUM=$(grep 'AppVersion ' $TBUILD/$REPO_NAME/Telegram/build/version | awk '{ print $2 }')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_NUM=$VERSION_NUM" >> $GITHUB_ENV

      - name: First set up.
        shell: bash
        run: |
          SDK="10.0.26100.0"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' \
            "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          git config --global user.email "AyuGramBuilder@users.noreply.github.com"
          git config --global user.name "AyuGram CI"

      - name: Native Tools Command Prompt.
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.arch }}
          sdk: ${{ env.SDK }}

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v5
        with:
          path: ${{ env.TBUILD }}/ThirdParty
          key: ${{ runner.OS }}-${{ matrix.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.LibrariesPath }}/*
            !${{ env.LibrariesPath }}/cache_keys
            !${{ env.LibrariesPath }}/[qQ]t[_-]*
            ${{ env.LibrariesPath }}/cache_keys/*
            !${{ env.LibrariesPath }}/cache_keys/[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-libs-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.LibrariesPath }}/[qQ]t[_-]*
            ${{ env.LibrariesPath }}/cache_keys/[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-qt-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-qt-

      - name: Setup Python.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply release patches.
        shell: python
        run: |
          import os, sys, re
          sys.stdout.reconfigure(encoding='utf-8')
          tbuild = os.environ["TBUILD"]
          repo = os.environ["REPO_NAME"]
          src = os.path.join(tbuild, repo)

          def patch(path, old, new, desc):
              full = os.path.join(src, path) if not os.path.isabs(path) else path
              if not os.path.exists(full):
                  print(f"[SKIP] {desc}: file not found")
                  return
              with open(full, "r", encoding="utf-8") as f:
                  content = f.read()
              if old in content:
                  with open(full, "w", encoding="utf-8", newline="\n") as f:
                      f.write(content.replace(old, new))
                  print(f"[OK] {desc}")
              elif new in content:
                  print(f"[ALREADY] {desc}")
              else:
                  print(f"[WARN] {desc}: target text not found")

          def patch_regex(path, pattern, new, desc):
              full = os.path.join(src, path) if not os.path.isabs(path) else path
              if not os.path.exists(full):
                  return
              with open(full, "r", encoding="utf-8") as f:
                  content = f.read()
              result, count = re.subn(pattern, new, content)
              if count > 0:
                  with open(full, "w", encoding="utf-8", newline="\n") as f:
                      f.write(result)
                  print(f"[OK] {desc}")

          patch("cmake/options_win.cmake",
                "/MP     # Enable multi process build.",
                "/MP\n        /FS",
                "Enable /FS flag")
          patch_regex("cmake/options_win.cmake",
                      r'/DEBUG(?!\:NONE)', '/DEBUG:NONE',
                      "Disable MSVC debug symbols")
          patch("cmake/variables.cmake",
                'set(CMAKE_MSVC_DEBUG_INFORMATION_FORMAT "ProgramDatabase" CACHE STRING "")',
                'set(CMAKE_MSVC_DEBUG_INFORMATION_FORMAT "" CACHE STRING "" FORCE)',
                "Clear MSVC debug info format")

          prep = "Telegram/build/prepare/prepare.py"
          patch(prep, "qt = os.environ.get('QT')", "qt = os.environ['QT']", "Fix QT env access")
          patch(prep, 'move out.dbg\\ossl_static.pdb', 'if exist out.dbg echo skip', "Skip OpenSSL PDB")
          patch(prep, 'move out.dbg\\ossl_static', 'if exist out.dbg echo skip', "Skip OpenSSL static move")
          patch(prep, 'SET CONFIGURATIONS=-debug-and-release', 'SET CONFIGURATIONS=-release', "Force Qt Release (Win)")
          patch(prep, 'CONFIGURATIONS=-debug-and-release', 'CONFIGURATIONS=-release', "Force Qt Release (Unix)")
          patch(prep, 'cmake --build . --config Debug', 'echo Skipping Debug build...', "Skip Debug builds (.)")
          patch(prep, 'cmake --build out --config Debug', 'echo Skipping Debug build...', "Skip Debug builds (out)")
          patch(prep, 'cmake --install . --config Debug', 'echo Skipping Debug install...', "Skip Debug installs")

          gh_repo = os.environ.get("GITHUB_REPOSITORY", "RezoxP/AyuGramDesktop-builder")
          update_url = f"https://raw.githubusercontent.com/{gh_repo}/update-manifest/"
          target = os.path.join(src, "Telegram", "SourceFiles", "storage", "localstorage.cpp")
          patch(target,
                'return AutoupdatePrefix("https://update.ayugram.one/");',
                f'return AutoupdatePrefix("{update_url}");',
                "Patch update URL (default)")
          patch(target,
                'const auto fixedPrefix = QString::fromStdString("https://update.ayugram.one/");',
                f'const auto fixedPrefix = QString::fromStdString("{update_url}");',
                "Patch update URL (fixed)")

      - name: Libraries.
        env:
          GYP_MSVS_OVERRIDE_PATH: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\'
          GYP_MSVS_VERSION: 2022
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent

      - name: Free up disk space.
        shell: bash
        run: |
          if [ -d "$LibrariesPath" ]; then
            find $LibrariesPath \
              '(' \
                '(' \
                  ! '(' \
                    -name '*.lib' \
                    -o -name '*.a' \
                    -o -name '*.exe' \
                    -o -name '*.h' \
                    -o -name '*.hpp' \
                    -o -name '*.inc' \
                    -o -name '*.cmake' \
                    -o -path '*/include/*' \
                    -o -path '*/objects-*' \
                    -o -path '*/cache_keys/*' \
                    -o -path '*/patches/*' \
                  ')' \
                  -type f \
                ')' \
                -o -empty \
              ')' -delete
          fi

      - name: Build AyuGram.
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
            ${{ matrix.arch }} ^
            -D TDESKTOP_API_ID=%TDESKTOP_API_ID% ^
            -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH% ^
            -D CMAKE_CONFIGURATION_TYPES=Release ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF ^
            -D DESKTOP_APP_ENABLE_LTO=ON

          cmake --build ..\out --config Release --parallel %NUMBER_OF_PROCESSORS%

      - name: Prepare artifact.
        run: |
          set "OUT=%TBUILD%\%REPO_NAME%\out\Release"
          mkdir artifact

          if exist "%OUT%\AyuGram.exe" (
            move "%OUT%\AyuGram.exe" artifact\
          ) else if exist "%OUT%\Telegram.exe" (
            move "%OUT%\Telegram.exe" artifact\AyuGram.exe
          )

          if exist "%OUT%\Updater.exe" move "%OUT%\Updater.exe" artifact\
          if exist "%OUT%\modules" xcopy "%OUT%\modules" artifact\modules\ /E /I /Y

      - name: Strip debug files.
        shell: pwsh
        run: |
          Get-ChildItem artifact\*.pdb -Recurse | Remove-Item -Force
          Get-ChildItem artifact\*.ilk -Recurse | Remove-Item -Force

      - name: Package.
        shell: pwsh
        run: |
          Compress-Archive -Path artifact\* -DestinationPath "AyuGram-Windows-${{ matrix.arch }}-${{ env.VERSION }}.zip"

      - name: Upload build artifact.
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-${{ matrix.arch }}
          path: artifact/

      - name: Upload release zip.
        uses: actions/upload-artifact@v4
        with:
          name: release-win-${{ matrix.arch }}
          path: "AyuGram-Windows-${{ matrix.arch }}-${{ env.VERSION }}.zip"

      - name: Save version.
        shell: bash
        run: |
          echo "$VERSION" > version.txt
          echo "$VERSION_NUM" > version_num.txt

      - name: Upload version info.
        uses: actions/upload-artifact@v4
        with:
          name: version-${{ matrix.arch }}
          path: |
            version.txt
            version_num.txt

  linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout builder repo.
        uses: actions/checkout@v4

      - name: Free up disk space.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
            /opt/ghc /usr/local/graalvm /usr/local/.ghcup \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true

      - name: Clone AyuGramDesktop.
        run: |
          git clone --recursive \
            --branch "${{ github.event.inputs.branch }}" \
            https://github.com/AyuGram/AyuGramDesktop.git tdesktop

      - name: Read version.
        run: |
          VERSION=$(grep 'AppVersionStr ' tdesktop/Telegram/build/version | awk '{ print $2 }')
          VERSION_NUM=$(grep 'AppVersion ' tdesktop/Telegram/build/version | awk '{ print $2 }')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_NUM=$VERSION_NUM" >> $GITHUB_ENV

      - name: Patch update URL.
        run: |
          REPO="${{ github.repository }}"
          URL="https://raw.githubusercontent.com/${REPO}/update-manifest/"
          sed -i "s|https://update.ayugram.one/|${URL}|g" \
            tdesktop/Telegram/SourceFiles/storage/localstorage.cpp

      - name: Build AyuGram (Docker).
        run: |
          cd tdesktop
          docker run --rm \
            -u $(id -u) \
            -v "$PWD:/usr/src/tdesktop" \
            -e CONFIG=Release \
            ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D TDESKTOP_API_ID=${{ env.TDESKTOP_API_ID }} \
            -D TDESKTOP_API_HASH=${{ env.TDESKTOP_API_HASH }} \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

      - name: Prepare artifact.
        run: |
          mkdir -p artifact
          for bin in AyuGram Telegram; do
            if [ -f "tdesktop/out/Release/$bin" ]; then
              cp "tdesktop/out/Release/$bin" artifact/AyuGram
              break
            fi
          done
          [ -f tdesktop/out/Release/Updater ] && cp tdesktop/out/Release/Updater artifact/
          strip --strip-debug --strip-unneeded artifact/* 2>/dev/null || true
          chmod +x artifact/*

      - name: Package.
        run: tar -czf "AyuGram-Linux-x64-${{ env.VERSION }}.tar.gz" -C artifact .

      - name: Upload build artifact.
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Linux-x64
          path: artifact/

      - name: Upload release tarball.
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: "AyuGram-Linux-x64-${{ env.VERSION }}.tar.gz"

      - name: Save version.
        run: |
          echo "$VERSION" > version.txt
          echo "$VERSION_NUM" > version_num.txt

      - name: Upload version info.
        uses: actions/upload-artifact@v4
        with:
          name: version-linux
          path: |
            version.txt
            version_num.txt

  release:
    name: Create Release
    needs: [windows, linux]
    if: success()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout builder repo.
        uses: actions/checkout@v4

      - name: Download all artifacts.
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Read version.
        run: |
          VERSION=$(cat artifacts/version-x64/version.txt)
          VERSION_NUM=$(cat artifacts/version-x64/version_num.txt)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_NUM=$VERSION_NUM" >> $GITHUB_ENV

      - name: Collect release files.
        run: |
          mkdir -p release
          cp artifacts/release-win-x64/*.zip release/ 2>/dev/null || true
          cp artifacts/release-win-x86/*.zip release/ 2>/dev/null || true
          cp artifacts/release-linux-x64/*.tar.gz release/ 2>/dev/null || true
          ls -lh release/

      - name: Generate update manifest.
        run: |
          REPO="${{ github.repository }}"
          TAG="v${{ env.VERSION }}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          cat > release/current4 << MANIFEST
          {
            "win64": { "stable": { "released": "${{ env.VERSION_NUM }}", "link": "${BASE}/AyuGram-Windows-x64-${{ env.VERSION }}.zip" } },
            "win":   { "stable": { "released": "${{ env.VERSION_NUM }}", "link": "${BASE}/AyuGram-Windows-x86-${{ env.VERSION }}.zip" } },
            "linux": { "stable": { "released": "${{ env.VERSION_NUM }}", "link": "${BASE}/AyuGram-Linux-x64-${{ env.VERSION }}.tar.gz" } }
          }
          MANIFEST

      - name: Create GitHub Release.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: AyuGram v${{ env.VERSION }}
          body: |
            AyuGram Desktop v${{ env.VERSION }}

            | Platform | Architecture | Download |
            |----------|-------------|----------|
            | Windows | x64 | `AyuGram-Windows-x64-${{ env.VERSION }}.zip` |
            | Windows | x86 | `AyuGram-Windows-x86-${{ env.VERSION }}.zip` |
            | Linux | x64 | `AyuGram-Linux-x64-${{ env.VERSION }}.tar.gz` |

            Built from branch: `${{ github.event.inputs.branch }}`
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update manifest branch.
        run: |
          git config user.email "AyuGramBuilder@users.noreply.github.com"
          git config user.name "AyuGram CI"
          git checkout --orphan update-manifest || git checkout update-manifest
          git rm -rf . 2>/dev/null || true
          cp release/current4 current4
          git add current4
          git commit -m "Update manifest for v${{ env.VERSION }}"
          git push -f origin update-manifest
