          echo "REPO_NAME=$REPO_NAME" >> $GITHUB_ENV
          echo "TBUILD=$GITHUB_WORKSPACE/TBuild" >> $GITHUB_ENV
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "COMMIT=$COMMIT" >> $GITHUB_ENV
          echo "LIBS_BASE=$GITHUB_WORKSPACE/TBuild/Libraries" >> $GITHUB_ENV

