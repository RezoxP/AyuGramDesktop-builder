  # ---------------------------------------------------------------------
  # Linux: x64 inside Docker centos_env environment
  # ---------------------------------------------------------------------
  linux:
    name: Linux x64
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_linux_x64 != false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    outputs:
      version: ${{ steps.version.outputs.version }}
      version_num: ${{ steps.version.outputs.version_num }}
      upstream_sha: ${{ steps.version.outputs.upstream_sha }}

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
            /opt/ghc /usr/local/graalvm /usr/local/.ghcup \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone AyuGramDesktop and pull Docker image
        run: |
          set -e
          docker pull ghcr.io/telegramdesktop/tdesktop/centos_env:latest &
          DOCKER_PID=$!

          BRANCH="${{ inputs.branch || 'dev' }}"
          git clone --filter=blob:none --depth 1 --branch "$BRANCH" \
            "https://github.com/${{ env.AYUGRAM_REPO }}.git" tdesktop

          if [ -n "${{ inputs.commit }}" ]; then
            if git -C tdesktop fetch --depth 1 origin "${{ inputs.commit }}"; then
              git -C tdesktop checkout --detach FETCH_HEAD
            fi
          fi

          git -C tdesktop submodule update --init --recursive --depth=1
          git -C tdesktop/cmake submodule update --init --recursive --depth=1
          wait $DOCKER_PID
          echo "UPSTREAM_SHA=$(git -C tdesktop rev-parse HEAD)" >> $GITHUB_ENV

      - name: Apply patches
        run: |
          python3 .github/scripts/apply_patches.py tdesktop \
            --platform linux \
            --manifest-url "https://raw.githubusercontent.com/${{ github.repository }}/update-manifest/"

      - name: Read version
        id: version
        run: |
          set -e
          VFILE="tdesktop/Telegram/build/version"
          VERSION=$(grep 'AppVersionStr ' "$VFILE" | awk '{ print $2 }')
          VERSION_NUM=$(grep 'AppVersion ' "$VFILE" | awk '{ print $2 }')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_NUM=$VERSION_NUM" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_num=$VERSION_NUM" >> $GITHUB_OUTPUT
          echo "upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT

      - name: Generate stub DesktopPrivate
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/DesktopPrivate"
          random_key() {
            printf -- '[REDACTED:ssh_private_key]\n%s\n-----END RSA PRIVATE KEY-----\n' \
              "$(head -c 96 /dev/urandom | base64 | tr -d '\n')"
          }
          printf 'const char *PrivateKey = "%s";\nconst char *PrivateBetaKey = "%s";\n' \
            "$(random_key)" "$(random_key)" > "$GITHUB_WORKSPACE/DesktopPrivate/packer_private.h"
          printf 'static const char *AlphaPrivateKey = "%s";\n' \
            "$(random_key)" > "$GITHUB_WORKSPACE/DesktopPrivate/alpha_private.h"

      - name: Enable parallel Docker build
        run: |
          sed -i 's|cmake --build \.\./out|cmake --build ../out --parallel $(nproc)|' \
            tdesktop/Telegram/build/docker/centos_env/build.sh

      - name: Build AyuGram
        run: |
          cd tdesktop
          docker run --rm \
            -u "$(id -u)" \
            -v "$PWD:/usr/src/tdesktop" \
            -v "$GITHUB_WORKSPACE/DesktopPrivate:/usr/src/DesktopPrivate" \
            -e CONFIG=Release \
            ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D TDESKTOP_API_ID=${{ env.TDESKTOP_API_ID }} \
            -D TDESKTOP_API_HASH=${{ env.TDESKTOP_API_HASH }} \
            -D CMAKE_CONFIGURATION_TYPES=Release \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON \
            -D DESKTOP_APP_ENABLE_LTO=${{ env.DESKTOP_APP_ENABLE_LTO }}

      - name: Package
        run: |
          set -e
          OUT="tdesktop/out/Release"
          [ -d "$OUT" ] || { echo "::error::$OUT not found"; exit 1; }
          mkdir -p pkg
          for bin in AyuGram Telegram; do
            [ -f "$OUT/$bin" ] && cp "$OUT/$bin" pkg/AyuGram && break
          done
          [ -f "$OUT/Updater" ] && cp "$OUT/Updater" pkg/ || true
          strip --strip-all pkg/* 2>/dev/null || true
          chmod +x pkg/*

          (cd pkg && zip -r -9 "../AyuGram-Linux-x64-${VERSION}.zip" .)
          tar -czf "AyuGram-Linux-x64-${VERSION}.tar.gz" -C pkg .

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Linux-x64-${{ env.VERSION }}
          path: |
            AyuGram-Linux-x64-${{ env.VERSION }}.zip
            AyuGram-Linux-x64-${{ env.VERSION }}.tar.gz
          retention-days: 90

  # ---------------------------------------------------------------------
  # macOS: Native Apple Silicon & Intel Universal binary on macos-14
  # ---------------------------------------------------------------------
  macos:
    name: macOS (Universal)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_macos != false }}
    runs-on: macos-14
    timeout-minutes: 360

    outputs:
      version: ${{ steps.version.outputs.version }}
      version_num: ${{ steps.version.outputs.version_num }}
      upstream_sha: ${{ steps.clone.outputs.upstream_sha }}

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /Library/Developer/CommandLineTools
          sudo rm -rf /Applications/Xcode*.app/Contents/Developer/Platforms/iPhoneOS.platform/Library/Developer/CoreSimulator
          sudo rm -rf /Applications/Xcode*.app/Contents/Developer/Platforms/WatchOS.platform
          sudo rm -rf /Applications/Xcode*.app/Contents/Developer/Platforms/AppleTVOS.platform
          sudo rm -rf /Applications/Xcode*.app/Contents/Developer/Platforms/XRSimulator.platform
          xcrun simctl erase all 2>/dev/null || true
          brew cleanup -s 2>/dev/null || true
          df -h

      - name: Install dependencies via Homebrew
        run: |
          brew install git automake libtool cmake wget pkg-config gnu-tar ninja nasm meson

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone AyuGramDesktop
        id: clone
        run: |
          set -e
          BRANCH="${{ inputs.branch || 'dev' }}"
          mkdir -p "$HOME/TBuild"
          git clone --filter=blob:none --depth 1 --branch "$BRANCH" \
            "https://github.com/${{ env.AYUGRAM_REPO }}.git" "$HOME/TBuild/tdesktop"

          if [ -n "${{ inputs.commit }}" ]; then
            if git -C "$HOME/TBuild/tdesktop" fetch --depth 1 origin "${{ inputs.commit }}"; then
              git -C "$HOME/TBuild/tdesktop" checkout --detach FETCH_HEAD
            fi
          fi

          git -C "$HOME/TBuild/tdesktop" submodule update --init --recursive --depth=1
          git -C "$HOME/TBuild/tdesktop/cmake" submodule update --init --recursive --depth=1
          UPSTREAM_SHA=$(git -C "$HOME/TBuild/tdesktop" rev-parse HEAD)
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV
          echo "upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT

      - name: Apply patches
        run: |
          python3 .github/scripts/apply_patches.py "$HOME/TBuild/tdesktop" \
            --platform macos \
            --manifest-url "https://raw.githubusercontent.com/${{ github.repository }}/update-manifest/"

      - name: Read version & cache key
        id: version
        run: |
          set -e
          VFILE="$HOME/TBuild/tdesktop/Telegram/build/version"
          VERSION=$(grep 'AppVersionStr ' "$VFILE" | awk '{ print $2 }')
          VERSION_NUM=$(grep 'AppVersion ' "$VFILE" | awk '{ print $2 }')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_NUM=$VERSION_NUM" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_num=$VERSION_NUM" >> $GITHUB_OUTPUT

          {
            echo "macOS-libs-v2"
            cat "$HOME/TBuild/tdesktop/Telegram/build/prepare/prepare.py"
            cat "$HOME/TBuild/tdesktop/Telegram/build/qt_version.py" 2>/dev/null || true
          } | shasum -a 256 | awk '{ print $1 }' > CACHE_KEY.txt
          echo "CACHE_KEY=$(cat CACHE_KEY.txt)" >> $GITHUB_ENV

      - name: Generate stub DesktopPrivate
        run: |
          mkdir -p "$HOME/TBuild/DesktopPrivate"
          random_key() {
            printf -- '[REDACTED:ssh_private_key]\n%s\n-----END RSA PRIVATE KEY-----\n' \
              "$(head -c 96 /dev/urandom | base64 | tr -d '\n')"
          }
          printf 'const char *PrivateKey = "%s";\nconst char *PrivateBetaKey = "%s";\n' \
            "$(random_key)" "$(random_key)" > "$HOME/TBuild/DesktopPrivate/packer_private.h"
          printf 'static const char *AlphaPrivateKey = "%s";\n' \
            "$(random_key)" > "$HOME/TBuild/DesktopPrivate/alpha_private.h"

      - name: Libraries cache (restore)
        uses: actions/cache/restore@v4
        id: cache-mac-libs
        with:
          path: |
            ~/TBuild/Libraries/*
            !~/TBuild/Libraries/cache_keys
            !~/TBuild/Libraries/[qQ]t[_-]*
            ~/TBuild/Libraries/cache_keys/*
            !~/TBuild/Libraries/cache_keys/[qQ]t[_-]*
          key: macOS-arm64-libs-v2-${{ env.CACHE_KEY }}
          restore-keys: macOS-arm64-libs-v2-

      - name: Qt cache (restore)
        uses: actions/cache/restore@v4
        id: cache-mac-qt
        with:
          path: |
            ~/TBuild/Libraries/[qQ]t[_-]*
            ~/TBuild/Libraries/cache_keys/[qQ]t[_-]*
          key: macOS-arm64-qt-v2-${{ env.CACHE_KEY }}
          restore-keys: macOS-arm64-qt-v2-

      - name: Build libraries
        run: |
          cd "$HOME/TBuild"
          ./tdesktop/Telegram/build/prepare/mac.sh

      - name: Free disk space before caching
        run: |
          if [ -d "$HOME/TBuild/Libraries" ]; then
            find "$HOME/TBuild/Libraries" \
              '(' \
                '(' \
                  ! '(' \
                    -name '*.a' -o -name '*.dylib' \
                    -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' \
                    -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' \
                    -o -path '*/objects-*' -o -path '*/cache_keys/*' \
                    -o -path '*/patches/*' \
                  ')' \
                  -type f \
                ')' \
                -o -empty \
              ')' -delete 2>/dev/null || true
          fi
          df -h

      - name: Save Libraries cache
        if: steps.cache-mac-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/TBuild/Libraries/*
            !~/TBuild/Libraries/cache_keys
            !~/TBuild/Libraries/[qQ]t[_-]*
            ~/TBuild/Libraries/cache_keys/*
            !~/TBuild/Libraries/cache_keys/[qQ]t[_-]*
          key: ${{ steps.cache-mac-libs.outputs.cache-primary-key }}

      - name: Save Qt cache
        if: steps.cache-mac-qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/TBuild/Libraries/[qQ]t[_-]*
            ~/TBuild/Libraries/cache_keys/[qQ]t[_-]*
          key: ${{ steps.cache-mac-qt.outputs.cache-primary-key }}

      - name: Build AyuGram
        run: |
          cd "$HOME/TBuild/tdesktop/Telegram"
          ./configure.sh \
            -D TDESKTOP_API_ID=${{ env.TDESKTOP_API_ID }} \
            -D TDESKTOP_API_HASH=${{ env.TDESKTOP_API_HASH }} \
            -D CMAKE_CONFIGURATION_TYPES=Release \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON \
            -D DESKTOP_APP_ENABLE_LTO=${{ env.DESKTOP_APP_ENABLE_LTO }}
          cmake --build ../out --config Release --parallel $(sysctl -n hw.ncpu)

      - name: Package
        run: |
          set -e
          OUT="$HOME/TBuild/tdesktop/out/Release"
          mkdir -p pkg
          for app in AyuGram.app Telegram.app; do
            if [ -d "$OUT/$app" ]; then
              cp -R "$OUT/$app" "pkg/AyuGram.app"
              break
            fi
          done
          [ -f "$OUT/Updater" ] && cp "$OUT/Updater" pkg/ || true

          # Create zip preserving symlinks & executable permissions
          (cd pkg && zip -r -y -9 "$GITHUB_WORKSPACE/AyuGram-macOS-${VERSION}.zip" .)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-macOS-${{ env.VERSION }}
          path: "AyuGram-macOS-${{ env.VERSION }}.zip"
          retention-days: 90

  # ---------------------------------------------------------------------
  # Linux 32-bit (x86, optional / on demand)
  # ---------------------------------------------------------------------
  linux_x86:
    name: Linux x86 (32-bit)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_linux_x86 != false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone AyuGramDesktop
        run: |
          BRANCH="${{ inputs.branch || 'dev' }}"
          git clone --filter=blob:none --depth 1 --branch "$BRANCH" \
            "https://github.com/${{ env.AYUGRAM_REPO }}.git" tdesktop
          git -C tdesktop submodule update --init --recursive --depth=1
          git -C tdesktop/cmake submodule update --init --recursive --depth=1

      - name: Apply patches
        run: |
          python3 .github/scripts/apply_patches.py tdesktop \
            --platform linux \
            --manifest-url "https://raw.githubusercontent.com/${{ github.repository }}/update-manifest/"

      - name: Read version
        run: |
          VFILE="tdesktop/Telegram/build/version"
          VERSION=$(grep 'AppVersionStr ' "$VFILE" | awk '{ print $2 }')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build AyuGram 32-bit
        run: |
          docker run --rm --platform linux/386 \
            -v "$PWD/tdesktop:/usr/src/tdesktop" \
            i386/debian:bookworm linux32 /bin/bash -c "
              apt-get update && apt-get install -y --no-install-recommends \
                cmake build-essential ninja-build python3 pkg-config git \
                libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev
              cd /usr/src/tdesktop/Telegram
              python3 configure.py -D CMAKE_BUILD_TYPE=Release -D DESKTOP_APP_USE_PACKAGED=ON
              cmake --build ../out --config Release --parallel \$(nproc)
            " || echo "::warning::32-bit Linux build experimental or partial"

      - name: Package
        run: |
          mkdir -p pkg-x86
          OUT="tdesktop/out/Release"
          for bin in AyuGram Telegram; do
            [ -f "$OUT/$bin" ] && cp "$OUT/$bin" pkg-x86/AyuGram && break
          done
          if [ -f pkg-x86/AyuGram ]; then
            chmod +x pkg-x86/*
            (cd pkg-x86 && zip -r -9 "../AyuGram-Linux-x86-${VERSION}.zip" .)
            tar -czf "AyuGram-Linux-x86-${VERSION}.tar.gz" -C pkg-x86 .
          fi

      - name: Upload
        if: hashFiles('AyuGram-Linux-x86-*.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Linux-x86-${{ env.VERSION }}
          path: |
            AyuGram-Linux-x86-${{ env.VERSION }}.zip
            AyuGram-Linux-x86-${{ env.VERSION }}.tar.gz
          retention-days: 90

  # ---------------------------------------------------------------------
  # Release: runs when enabled builds succeed
  # ---------------------------------------------------------------------
  release:
    name: Create Release
    needs: [windows_x64, windows_x86, linux, macos, linux_x86]
    if: ${{ always() && contains(needs.*.result, 'success') && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (inputs.create_release != false) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/
          merge-multiple: true

      - name: Determine version from artifacts
        id: info
        run: |
          set -e
          ZIP_NAME=$(ls release/AyuGram-*.zip 2>/dev/null | head -1 | xargs -n1 basename || true)
          if [ -z "$ZIP_NAME" ]; then
            echo "::error::No release zip artifacts found"
            exit 1
          fi
          # Extract version like 7.2.9 from AyuGram-Windows-x64-7.2.9.zip
          VERSION=$(echo "$ZIP_NAME" | sed -r 's/AyuGram-[A-Za-z0-9_-]+-([0-9]+\.[0-9]+(\.[0-9]+)?)\.zip/\1/')
          VERSION_NUM=$(echo "$VERSION" | awk -F. '{ printf("%d%03d%03d", $1, $2, $3) }')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_num=$VERSION_NUM" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION ($VERSION_NUM)"

      - name: Resolve release tag
        id: tag
        env:
          VERSION: ${{ steps.info.outputs.version }}
          UPSTREAM_SHA: ${{ needs.linux.outputs.upstream_sha || needs.windows_x64.outputs.upstream_sha || needs.macos.outputs.upstream_sha }}
        run: |
          set -e
          SHORTSHA="${UPSTREAM_SHA:0:7}"
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null 2>&1; then
            TAG="v${VERSION}-${SHORTSHA:-latest}"
            echo "::warning::Tag v${VERSION} already exists — using collision-free tag ${TAG}"
          else
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_ENV

      - name: Generate Checksums
        run: |
          cd release
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag }}
          name: AyuGram v${{ steps.info.outputs.version }}
          make_latest: true
          body: |
            **AyuGram Desktop v${{ steps.info.outputs.version }}**

            | Platform | Architecture | Package Format | File |
            |----------|--------------|----------------|------|
            | Windows  | x64 (64-bit) | zip            | `AyuGram-Windows-x64-${{ steps.info.outputs.version }}.zip` |
            | Windows  | x86 (32-bit) | zip            | `AyuGram-Windows-x86-${{ steps.info.outputs.version }}.zip` |
            | Linux    | x64 (64-bit) | zip / tar.gz   | `AyuGram-Linux-x64-${{ steps.info.outputs.version }}.zip` |
            | macOS    | Universal (Apple Silicon & Intel) | zip (.app bundle) | `AyuGram-macOS-${{ steps.info.outputs.version }}.zip` |

            Upstream commit: ${{ needs.linux.outputs.upstream_sha || inputs.commit || '(branch tip)' }}
            Upstream branch: `${{ inputs.branch || 'dev' }}`
            LTO: ${{ env.DESKTOP_APP_ENABLE_LTO }}

            *Verify file integrity with the attached `SHA256SUMS.txt`.*
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update manifest
        env:
          VERSION: ${{ steps.info.outputs.version }}
          VERSION_NUM: ${{ steps.info.outputs.version_num }}
          TAG: ${{ env.tag }}
        run: |
          set -e
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          mkdir -p manifest-repo

          # Dynamically construct manifest
          python3 -c "
          import json, os
          base = os.environ['BASE']
          v = os.environ['VERSION']
          vnum = os.environ['VERSION_NUM']
          m = {
              'win64': { 'stable': { 'released': vnum, 'link': f'{base}/AyuGram-Windows-x64-{v}.zip' } },
              'win':   { 'stable': { 'released': vnum, 'link': f'{base}/AyuGram-Windows-x86-{v}.zip' } },
              'mac':   { 'stable': { 'released': vnum, 'link': f'{base}/AyuGram-macOS-{v}.zip' } },
              'armac': { 'stable': { 'released': vnum, 'link': f'{base}/AyuGram-macOS-{v}.zip' } },
              'linux': { 'stable': { 'released': vnum, 'link': f'{base}/AyuGram-Linux-x64-{v}.zip' } }
          }
          if os.path.exists(f'release/AyuGram-Linux-x86-{v}.zip'):
              m['linux32'] = { 'stable': { 'released': vnum, 'link': f'{base}/AyuGram-Linux-x86-{v}.zip' } }
          with open('manifest-repo/current4', 'w', encoding='utf-8') as f:
              json.dump(m, f, indent=2)
          "

          python3 -m json.tool manifest-repo/current4 > /dev/null

          cd manifest-repo
          git init -q
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git config user.email "AyuGramBuilder@users.noreply.github.com"
          git config user.name "AyuGram CI"
          git checkout --orphan update-manifest
          git add current4
          git commit -q -m "Update manifest for ${TAG}"
          git push -f origin update-manifest
