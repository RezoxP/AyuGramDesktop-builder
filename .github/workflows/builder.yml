name: AyuGram Personal Stripped Builder

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'dev'

env:
  TDESKTOP_API_ID: "2040"
  TDESKTOP_API_HASH: "b18441a1ff607e10a989891a5462e627"

jobs:
  build:
    name: Production Build (Stripped)
    runs-on: windows-2022
    timeout-minutes: 240 

    steps:
      - name: 📥 Fast Checkout
        uses: actions/checkout@v4
        with:
          repository: AyuGram/AyuGramDesktop
          ref: ${{ github.event.inputs.branch }}
          submodules: recursive
          fetch-depth: 1 

      - name: 🧹 Deep Clean Disk
        shell: cmd
        run: |
          if exist "C:\Program Files\Android" rmdir /s /q "C:\Program Files\Android"
          if exist "C:\hostedtoolcache\windows" rmdir /s /q "C:\hostedtoolcache\windows"
          if exist "C:\Program Files\dotnet" rmdir /s /q "C:\Program Files\dotnet"
          if exist "C:\mysql" rmdir /s /q "C:\mysql"
          
          :: Stop SQL Server processes locking the files
          net stop SQLWriter 2>nul || ver >nul
          taskkill /F /IM sqlwriter.exe /T 2>nul || ver >nul
          taskkill /F /IM sqlservr.exe /T 2>nul || ver >nul
          
          if exist "C:\Program Files\Microsoft SQL Server" rmdir /s /q "C:\Program Files\Microsoft SQL Server"
          
          :: Force the step to report success regardless of process exit codes
          exit /b 0

      - name: 💽 Expand Virtual Memory
        uses: al-cheb/configure-pagefile-action@v1.4
        with:
          minimum-size: 16GB
          maximum-size: 32GB 
          disk-root: "C:"

      - name: 🐍 Setup Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🩹 Apply Stripping & Parallel Patches
        shell: python
        run: |
          import os
          import sys
          import re
          
          # Force Windows to output UTF-8 so our emojis don't crash the runner
          sys.stdout.reconfigure(encoding='utf-8')

          def patch(path, old, new, desc):
              if not os.path.exists(path): 
                  print(f"❌ [SKIPPED] File not found: {path}")
                  return
              
              with open(path, 'r', encoding='utf-8') as f: content = f.read()
              
              if old in content:
                  with open(path, 'w', encoding='utf-8', newline='\n') as f:
                      f.write(content.replace(old, new))
                  print(f"✅ [SUCCESS] {desc}")
              elif new in content:
                  print(f"⚡ [ALREADY APPLIED] {desc}")
              else:
                  print(f"⚠️ [WARNING] Target text not found: {desc}")

          # NEW: Regex patch function
          def patch_regex(path, pattern, new, desc):
              if not os.path.exists(path): return
              with open(path, 'r', encoding='utf-8') as f: content = f.read()
              
              new_content, count = re.subn(pattern, new, content)
              if count > 0:
                  with open(path, 'w', encoding='utf-8', newline='\n') as f:
                      f.write(new_content)
                  print(f"✅ [SUCCESS] {desc}")
              else:
                  print(f"⚠️ [WARNING] Pattern not found: {desc}")

          print("--- Stripping Telegram Debug Symbols ---")
          patch('cmake/options_win.cmake', '/MP      # Enable multi process build.', '/MP\n        /FS', 'Enable /FS flag with /MP')
          
          # FIX: Use regex to prevent turning /DEBUG:NONE into /DEBUG:NONE:NONE
          patch_regex('cmake/options_win.cmake', r'/DEBUG(?!\:NONE)', '/DEBUG:NONE', 'Disable MSVC Debug Symbols (/DEBUG:NONE)')
          
          patch('cmake/variables.cmake', 'set(CMAKE_MSVC_DEBUG_INFORMATION_FORMAT "ProgramDatabase" CACHE STRING "")', 'set(CMAKE_MSVC_DEBUG_INFORMATION_FORMAT "" CACHE STRING "" FORCE)', 'Clear MSVC Debug Info Format')

          print("\n--- Patching prepare.py for Release-Only Builds ---")
          prep = 'Telegram/build/prepare/prepare.py'
          patch(prep, "qt = os.environ.get('QT')", "qt = os.environ['QT']", 'Fix QT env variable access')
          patch(prep, 'move out.dbg\\ossl_static.pdb', 'if exist out.dbg echo skip', 'Skip OpenSSL PDB move')
          patch(prep, 'move out.dbg\\ossl_static', 'if exist out.dbg echo skip', 'Skip OpenSSL static move')
          patch(prep, 'SET CONFIGURATIONS=-debug-and-release', 'SET CONFIGURATIONS=-release', 'Force Qt Release mode (Windows)')
          patch(prep, 'CONFIGURATIONS=-debug-and-release', 'CONFIGURATIONS=-release', 'Force Qt Release mode (Unix)')
          patch(prep, 'cmake --build . --config Debug', 'echo Skipping Debug build...', 'Skip CMake Debug builds (.)')
          patch(prep, 'cmake --build out --config Debug', 'echo Skipping Debug build...', 'Skip CMake Debug builds (out)')
          patch(prep, 'cmake --install . --config Debug', 'echo Skipping Debug install...', 'Skip CMake Debug installs')

      - name: 🛠️ Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 📦 Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ../Libraries
            ../ThirdParty
          key: ${{ runner.os }}-ayu-personal-${{ hashFiles('Telegram/build/prepare/prepare.py') }}
          restore-keys: ${{ runner.os }}-ayu-personal-

      - name: ⚙️ Prepare & Configure
        shell: cmd
        run: |
          call Telegram\build\prepare\win.bat
          call Telegram\configure.bat x64 -D TDESKTOP_API_ID=%TDESKTOP_API_ID% -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH%

      - name: 🚀 Build (Parallelized)
        shell: cmd
        run: cmake --build out --config Release --target Telegram --parallel %NUMBER_OF_PROCESSORS%

      - name: 🏷️ Check Version & Ensure Binary Exists
        shell: pwsh
        run: |
          $expectedExe = "out\Release\AyuGram.exe"
          $altExe = "out\Release\Telegram.exe"
          
          # If it compiled as Telegram.exe, rename it just to be safe
          if (Test-Path $altExe) {
              Move-Item $altExe $expectedExe
              Write-Host "✅ Binary renamed from Telegram.exe to AyuGram.exe"
          }
          
          if (Test-Path $expectedExe) {
              # Extract the version metadata from the compiled exe
              $ver = (Get-Item $expectedExe).VersionInfo.FileVersion
              
              Write-Host "========================================="
              Write-Host "🎉 SUCCESS! Built AyuGram Version: $ver"
              Write-Host "========================================="
          } else {
              Write-Error "❌ Build failed: AyuGram.exe not found!"
              exit 1
          }

      - name: 📤 Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Stripped-Win64
          path: |
            out/Release/AyuGram.exe
            out/Release/Updater.exe
            out/Release/modules/
          compression-level: 9
