name: Auto update

# Watches upstream AyuGram/AyuGramDesktop changelog and dispatches a full build
# whenever a new version entry is published in changelog.txt.
#
# Design notes:
#   * Updates are triggered based on changelog releases rather than raw commits,
#     avoiding unnecessary builds on work-in-progress or non-release commits.
#   * Automated builds use enable_lto=false for fast, stable, and memory-safe CI.
#   * Concurrency group plus in-progress guard prevents duplicate runs.

on:
  schedule:
    # Every hour at minute 23
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/auto-update.yml'
      - '.github/workflows/build.yml'
      - '.github/scripts/**'

permissions:
  contents: read
  actions: write

concurrency:
  group: ayugram-auto-update
  cancel-in-progress: false

jobs:
  check:
    name: Check upstream changelog & dispatch build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Fetch and parse upstream changelog
        id: upstream
        run: |
          set -e
          CHANGELOG_URL="https://raw.githubusercontent.com/AyuGram/AyuGramDesktop/dev/changelog.txt"
          echo "Fetching changelog from $CHANGELOG_URL..."
          curl -fsSL "$CHANGELOG_URL" -o changelog.txt

          python3 -c "
          import os, sys, re

          with open('changelog.txt', 'r', encoding='utf-8', errors='ignore') as f:
              content = f.read(65536)

          match = re.search(r'^([0-9]+(\.[0-9]+)+(\s+[a-z]+)?)\s*\(([^)]+)\)', content, re.MULTILINE)
          if not match:
              print('::error::Could not parse version from changelog.txt', file=sys.stderr)
              sys.exit(1)

          full_ver = match.group(1).strip()
          clean_ver = full_ver.split()[0]
          date = match.group(4).strip()

          print(f'Detected changelog version: {clean_ver} ({date})')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'version={clean_ver}\n')
              f.write(f'full_version={full_ver}\n')
              f.write(f'date={date}\n')
          "

      - name: Read latest release in repository
        id: last
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RELEASE_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name // ""' 2>/dev/null || true)
          # Strip leading 'v'
          RELEASE_VER=$(echo "$RELEASE_TAG" | sed 's/^v//' | cut -d'-' -f1)
          echo "version=${RELEASE_VER:-}" >> $GITHUB_OUTPUT
          if [ -n "$RELEASE_VER" ]; then
            echo "Latest repository release: v$RELEASE_VER (tag: $RELEASE_TAG)"
          else
            echo "No previous release found in repository — fresh repository."
          fi

      - name: Skip if a build is already running or queued
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BUSY=$(gh run list -R "$GITHUB_REPOSITORY" --workflow=build.yml --json status --limit 30 \
            | python3 -c "import json, sys; s = sys.stdin.read().strip() or '[]'; runs = json.loads(s); print(sum(1 for r in runs if r.get('status') in ('in_progress', 'queued')))")
          echo "busy=$BUSY" >> $GITHUB_OUTPUT
          echo "Active build.yml runs: $BUSY"

      - name: Dispatch build
        if: steps.last.outputs.version != steps.upstream.outputs.version && steps.guard.outputs.busy == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_VER: ${{ steps.upstream.outputs.version }}
        run: |
          set -e
          echo "New changelog version detected: $UPSTREAM_VER (current released: ${{ steps.last.outputs.version || 'none' }})"
          echo "Dispatching build.yml..."
          gh workflow run build.yml \
            -R "$GITHUB_REPOSITORY" \
            --ref "${GITHUB_REF_NAME:-main}" \
            -f branch=dev \
            -f enable_lto=false \
            -f create_release=true
          echo "Dispatched build.yml successfully for changelog version $UPSTREAM_VER."

      - name: Summary
        if: always()
        run: |
          {
            echo "## Changelog-Based Auto-Update Check"
            echo ""
            echo "| Parameter | Value |"
            echo "|---|---|"
            echo "| Upstream Changelog Version | \`${{ steps.upstream.outputs.version }}\` (${{ steps.upstream.outputs.date }}) |"
            echo "| Current Released Version | \`${{ steps.last.outputs.version || '(none)' }}\` |"
            echo "| Active Builder Runs | ${{ steps.guard.outputs.busy || '0' }} |"
            if [ "${{ steps.last.outputs.version != steps.upstream.outputs.version }}" = "true" ]; then
              if [ "${{ steps.guard.outputs.busy || '0' }}" = "0" ]; then
                echo "| Outcome | **Dispatched new release build** |"
              else
                echo "| Outcome | **New version detected — waiting for active build to finish** |"
              fi
            else
              echo "| Outcome | Up-to-date (no action needed) |"
            fi
          } >> $GITHUB_STEP_SUMMARY
